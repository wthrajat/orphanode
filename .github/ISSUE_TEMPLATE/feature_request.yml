name: Feature request
description: Propose a change grounded in a concrete user problem.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who encounters it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the observable behavior, inputs, and outputs.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or other designs you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add small examples, links, or compatibility constraints.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the product roadmap for this request.
          required: true

