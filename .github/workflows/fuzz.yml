name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parser_facts
            max_length: 65536
          - target: config_manifest
            max_length: 32768
          - target: resolver_specifier
            max_length: 4096
          - target: plugin_protocol
            max_length: 65536
          - target: cache_corruption
            max_length: 65536
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly Rust
        run: >-
          rustup toolchain install nightly-2026-08-01
          --profile minimal
          --no-self-update
      - name: Install cargo-fuzz
        run: >-
          cargo +nightly-2026-08-01 install cargo-fuzz
          --version 0.13.2
          --locked
      - name: Run bounded fuzz target
        run: >-
          cargo +nightly-2026-08-01 fuzz run
          "${{ matrix.target }}"
          "fuzz/corpus/${{ matrix.target }}"
          --
          -max_total_time=300
          -max_len=${{ matrix.max_length }}
          -timeout=10
          -rss_limit_mb=2048
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
