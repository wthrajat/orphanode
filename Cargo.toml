[workspace]
members = [
    "crates/orphanode",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Orphanode contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/wthrajat/orphanode"
repository = "https://github.com/wthrajat/orphanode"
keywords = ["static-analysis", "javascript", "typescript", "dead-code", "reachability"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

[workspace.dependencies]
clap = { version = "4.6.5", features = ["derive"] }
ignore = "0.4.23"
oxc_allocator = "=0.144.0"
oxc_ast = "=0.144.0"
oxc_ast_visit = "=0.144.0"
oxc_diagnostics = "=0.144.0"
oxc_ecmascript = "=0.144.0"
oxc_parser = "=0.144.0"
oxc_resolver = { version = "=11.24.2", features = ["yarn_pnp"] }
oxc_semantic = "=0.144.0"
oxc_span = "=0.144.0"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-json", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
posthog-rs = { git = "https://github.com/wthrajat/posthog-rs", branch = "feat/tracing-span-context", features = ["mcp"] }
posthog-rs-otel = { git = "https://github.com/wthrajat/posthog-rs", branch = "feat/tracing-span-context" }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
