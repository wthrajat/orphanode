[package]
name = "orphanode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Accuracy-first reachability analysis for JavaScript and TypeScript projects, as a library and a CLI"
license.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/orphanode"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
exclude = ["tests/**"]

[lib]
name = "orphanode"
path = "src/lib.rs"

[[bin]]
name = "orphanode"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ignore.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_diagnostics.workspace = true
oxc_ecmascript.workspace = true
oxc_parser.workspace = true
oxc_resolver.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
posthog-rs = { workspace = true, optional = true }
posthog-rs-otel = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
mcp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:posthog-rs",
    "dep:posthog-rs-otel",
    "dep:rmcp",
    "dep:tokio",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dev-dependencies]
criterion = "=0.8.2"

[[bench]]
name = "hot_paths"
harness = false

[lints]
workspace = true
